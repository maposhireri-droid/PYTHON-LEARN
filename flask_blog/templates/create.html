{% extends "base.html" %}

{% block title %}Create Post - Flask Blog{% endblock %}

{% block content %}
<div class="create-post-section">
    <h1>Create a New Post</h1>
    
    <form id="post-form" method="POST" class="post-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required placeholder="Enter post title">
        </div>
        
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" placeholder="Your name">
        </div>
        
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10" required placeholder="Write your blog post content here..."></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-primary">Publish Post</button>
            <a href="/" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
document.getElementById('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(document.getElementById('post-form'));
    
    try {
        const response = await fetch('/create', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            alert('Post published successfully!');
            window.location.href = '/post/' + data.id;
        }
    } catch (error) {
        alert('Error publishing post: ' + error.message);
    }
});
</script>
{% endblock %}
